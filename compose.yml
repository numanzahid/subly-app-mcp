name: subly-mcp

services:
  subly-mcp:
    build: .
    container_name: subly-mcp
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      solidtime:
        aliases:
          - subly-mcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  solidtime:
    external: true
    name: solidtime_solidtime
